<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor de Vídeo</title>
<style>
:root{--bg:#0D0F13;--b1:#15181E;--b2:#1B1F27;--b3:#262B35;--ln:#272C36;--tx:#E9EBEF;--t2:#8B93A3;--ac:#8FA98F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.bar{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;flex:0 0 auto;align-items:center}
.b{height:42px;min-width:42px;padding:0 12px;border-radius:10px;border:1px solid var(--ln);background:var(--b2);color:var(--tx);font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.b:active{background:var(--b3)}.b.p{background:var(--ac);color:#0b0d10;border-color:transparent;font-weight:600}.b.rec{background:#c9776b}
#pv{flex:0 0 30dvh;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
#cv{max-width:100%;max-height:100%}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t2);text-align:center;padding:20px;pointer-events:none}
#tm{font:13px ui-monospace,monospace;color:var(--t2);flex:0 0 auto;padding:0 4px}
#tl{overflow-x:auto;overflow-y:hidden;background:var(--b1);flex:0 0 188px;border-block:1px solid var(--ln)}
#tc{position:relative;height:186px}
#ruler{height:24px;position:relative;border-bottom:1px solid var(--ln);touch-action:none}
#ruler i{position:absolute;top:5px;font:10px ui-monospace,monospace;color:var(--t2);font-style:normal;padding-left:3px;border-left:1px solid var(--ln)}
.lane{position:absolute;left:0;height:38px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--ln)}
.it{position:absolute;height:34px;border-radius:7px;font-size:12px;line-height:34px;padding:0 8px;white-space:nowrap;overflow:hidden;color:#fff;touch-action:none;user-select:none;opacity:.9}
.it.on{outline:2px solid #fff;opacity:1}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#ff5d5d;pointer-events:none;z-index:5}
#ins{flex:1;overflow-y:auto;padding:6px 14px 18px;min-height:90px}
.hint{color:var(--t2);padding:14px 0;line-height:1.5}
.r{display:block;margin:10px 0}.r span{display:flex;justify-content:space-between;color:var(--t2);font-size:13px;margin-bottom:4px}.r b{color:var(--tx);font-weight:500}
input[type=range]{width:100%;height:28px;accent-color:var(--ac)}
select,textarea{width:100%;background:var(--b2);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:10px;font:inherit;font-size:16px}
#ar{width:auto;padding:8px}textarea{min-height:64px}input[type=color]{width:100%;height:42px;border:0;background:none}
.c{display:flex;align-items:center;gap:8px;margin:10px 0}.c input{width:20px;height:20px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:#000d;border:1px solid var(--ln);padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;z-index:9}
</style></head><body>
<div class="bar"><button class="b" id="un">↶</button><button class="b" id="re">↷</button>
<select id="ar"><option value="720x1280">9:16</option><option value="1280x720">16:9</option><option value="720x720">1:1</option></select>
<span style="flex:1"></span><button class="b p" id="exp">Exportar</button></div>
<div id="pv"><canvas id="cv" width="720" height="1280"></canvas><div id="empty">Adicione um vídeo ou imagem para começar</div></div>
<div class="bar"><button class="b" id="hm">⏮</button><button class="b p" id="pp">▶</button><span id="tm">0:00.0 / 0:00.5</span>
<button class="b" id="sp">✂</button><button class="b" id="du">⧉</button><button class="b" id="dl">🗑</button><button class="b" id="zo">−</button><button class="b" id="zi">+</button></div>
<div id="tl"><div id="tc"></div></div>
<div class="bar">
<label class="b">🎞 Vídeo/Imagem<input id="fv" type="file" hidden multiple accept="video/*,image/*"></label>
<label class="b">🎵 Música<input id="fa" type="file" hidden multiple accept="audio/*"></label>
<button class="b" id="tx">T Texto</button><button class="b" id="mic">🎙 Narrar</button></div>
<div id="ins"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let items=[],media={},els={},imgs={},gains={},sid=null,t=0,playing=false,pps=60,AC,dest,saved='[]',hist=[],fut=[],exporting=false,t0=0,tS=0,raf=0,dirty=1,rec=null,recd,chunks,wl,ph;
const cv=$('#cv'),ctx=cv.getContext('2d'),tc=$('#tc'),ins=$('#ins');
const FN=[['none','Nenhum'],['pb','Preto e branco'],['sepia','Sépia'],['vivid','Vívido'],['cold','Frio'],['warm','Quente'],['vint','Vintage'],['cont','Contraste'],['blur','Desfoque'],['neg','Negativo']];
const FILT={none:'',pb:'grayscale(1)',sepia:'sepia(.9)',vivid:'saturate(1.8) contrast(1.1)',cold:'hue-rotate(-25deg) saturate(1.2)',warm:'sepia(.35) saturate(1.5)',vint:'sepia(.5) contrast(.9) brightness(1.1)',cont:'contrast(1.5)',blur:'blur(4px)',neg:'invert(1)'};
const AN=[['none','Nenhuma'],['zoom','Zoom'],['slide','Deslizar'],['up','Subir'],['spin','Girar']];
const OF={vol:v=>Math.round(v*100)+'%',x:v=>Math.round(v*100)+'%',y:v=>Math.round(v*100)+'%',scale:v=>Math.round(v*100)+'%',br:v=>v+'%',speed:v=>v+'x',rot:v=>v+'°',start:v=>(+v).toFixed(1)+'s',dur:v=>(+v).toFixed(1)+'s',in:v=>(+v).toFixed(1)+'s',fi:v=>v+'s',fo:v=>v+'s',size:v=>v};
const LC=['#4f7cff','#9b6bff','#c9a24f','#4f9f6f'],IC={video:'🎞',image:'🖼',text:'T',audio:'🎵'};
const mk=o=>({id:uid(),type:'video',mid:null,start:0,dur:4,in:0,vol:1,speed:1,filt:'none',br:100,fi:0,fo:0,anim:'none',layer:0,x:.5,y:.5,scale:1,rot:0,fit:'contain',text:'Seu texto',color:'#ffffff',size:7,bold:1,box:0,font:'system-ui',...o});
const total=()=>Math.max(.5,...items.map(i=>i.start+i.dur)),get=id=>items.find(i=>i.id===id);
const fmt=s=>Math.floor(Math.max(0,s)/60)+':'+(Math.max(0,s)%60).toFixed(1).padStart(4,'0');
const lane=i=>i.type==='audio'?3:i.type==='text'?2:i.layer;
function msg(x){const e=$('#toast');e.textContent=x;e.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.opacity=0,2800)}
function setAR(v){const[w,h]=v.split('x').map(Number);cv.width=w;cv.height=h;dirty=1}
// ── mídia ──
async function addFiles(files,o={}){
  for(const f of files){
    const isV=f.type.startsWith('video'),isI=f.type.startsWith('image'),isA=f.type.startsWith('audio');
    if(!(isV||isI||isA)){msg('Formato não suportado: '+f.name);continue}
    const url=URL.createObjectURL(f),mid=uid(),m=media[mid]={url,name:f.name,dur:0};
    try{
      if(isI){const im=new Image();im.src=url;await im.decode();imgs[mid]=im}
      else{const e=document.createElement(isV?'video':'audio');e.preload='metadata';e.src=url;await new Promise((ok,no)=>{e.onloadedmetadata=ok;e.onerror=no});m.dur=isFinite(e.duration)?e.duration:(o.dur||30)}
    }catch{msg('Não consegui abrir '+f.name);continue}
    let it;
    if(isA)it=mk({type:'audio',mid,start:o.start||0,dur:items.length&&!o.dur?Math.min(m.dur,total()):m.dur,vol:.8});
    else{const vs=items.filter(i=>i.type!=='audio'&&i.type!=='text'&&i.layer===0);it=mk({type:isV?'video':'image',mid,start:vs.length?Math.max(...vs.map(i=>i.start+i.dur)):0,dur:isI?4:m.dur})}
    items.push(it);ensureEl(it);sid=it.id;
  }
  commit();rAll();
}
function ensureEl(i){if(i.type==='text'||i.type==='image'||els[i.id])return;const e=document.createElement(i.type==='audio'?'audio':'video');e.src=media[i.mid].url;e.preload='auto';e.playsInline=true;e.onseeked=()=>dirty=1;els[i.id]=e}
function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();dest=AC.createMediaStreamDestination()}
function wire(i){const e=els[i.id];if(!e||gains[i.id])return;initAudio();const s=AC.createMediaElementSource(e),g=AC.createGain();s.connect(g);g.connect(AC.destination);g.connect(dest);gains[i.id]=g}
const env=(i,lt)=>{let a=1;if(i.fi>0&&lt<i.fi)a=lt/i.fi;if(i.fo>0&&i.dur-lt<i.fo)a=Math.min(a,(i.dur-lt)/i.fo);return Math.max(0,a)};
// ── reprodução ──
function sync(){
  for(const i of items){
    if(i.type!=='video'&&i.type!=='audio')continue;ensureEl(i);
    const e=els[i.id],act=t>=i.start&&t<i.start+i.dur,want=i.in+(t-i.start)*i.speed;
    if(act){
      if(playing){wire(i);gains[i.id].gain.value=i.vol*env(i,t-i.start);e.playbackRate=i.speed;
        if(e.paused){e.currentTime=want;e.play().catch(()=>{})}else if(Math.abs(e.currentTime-want)>.4)e.currentTime=want}
      else if(i.type==='video'&&Math.abs(e.currentTime-want)>.05)e.currentTime=want;
    }else if(!e.paused)e.pause();
  }
}
function play(){if(playing)return;initAudio();AC.resume();if(t>=total()-.05)t=0;playing=true;t0=performance.now();tS=t;$('#pp').textContent='⏸';raf=requestAnimationFrame(tick)}
function stop(){playing=false;$('#pp').textContent='▶';for(const i of items){const e=els[i.id];if(e&&!e.paused)e.pause()}cancelAnimationFrame(raf);dirty=1}
function tick(n){
  if(!playing)return;t=tS+(n-t0)/1000;
  if(t>=total()){t=total();stop();draw();ui();if(exporting)setTimeout(()=>recd.state!=='inactive'&&recd.stop(),400);return}
  if(exporting)$('#exp').textContent='Exportando '+Math.round(t/total()*100)+'%';
  sync();draw();ui(1);raf=requestAnimationFrame(tick);
}
function seek(x){t=Math.max(0,Math.min(x,total()));if(playing){tS=t;t0=performance.now()}sync();dirty=1;ui()}
(function loop(){if(dirty&&!playing){dirty=0;draw()}requestAnimationFrame(loop)})();
// ── desenho ──
function wrap(s,mw){const out=[];for(const p of String(s).split('\n')){let l='';for(const w of p.split(' ')){const c=l?l+' '+w:w;if(l&&ctx.measureText(c).width>mw){out.push(l);l=w}else l=c}out.push(l)}return out}
function drawText(i,W,H){
  const fs=i.size*H/100;ctx.font=`${i.bold?800:500} ${fs}px ${i.font}`;ctx.textAlign='center';ctx.textBaseline='middle';
  const L=wrap(i.text,W*.9),lh=fs*1.2,y0=-(L.length-1)*lh/2;
  if(i.box){const w=Math.max(...L.map(l=>ctx.measureText(l).width))+fs*.6;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(-w/2,y0-lh/2-fs*.1,w,L.length*lh+fs*.2)}
  ctx.lineJoin='round';ctx.lineWidth=fs*.14;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.fillStyle=i.color;
  L.forEach((l,k)=>{const y=y0+k*lh;if(!i.box)ctx.strokeText(l,0,y);ctx.fillText(l,0,y)});
}
function draw(){
  const W=cv.width,H=cv.height;ctx.globalAlpha=1;ctx.filter='none';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const act=items.filter(i=>i.type!=='audio'&&t>=i.start&&t<i.start+i.dur).sort((a,b)=>(a.type==='text'?9:a.layer)-(b.type==='text'?9:b.layer)||a.start-b.start);
  for(const i of act){
    const lt=t-i.start,e=1-Math.pow(1-Math.min(1,lt/.6),3);let a=env(i,lt),sc=1,dx=0,dy=0,rot=0;
    if(i.anim==='zoom'){sc=.4+.6*e;a*=e}else if(i.anim==='slide')dx=-(1-e)*W;else if(i.anim==='up'){dy=(1-e)*H*.5;a*=e}else if(i.anim==='spin'){rot=(1-e)*Math.PI*2;sc=e}
    ctx.save();ctx.globalAlpha=a;ctx.translate(i.x*W+dx,i.y*H+dy);ctx.rotate(rot+i.rot*Math.PI/180);ctx.scale(sc,sc);
    if(i.type==='text')drawText(i,W,H);
    else{const s=i.type==='image'?imgs[i.mid]:els[i.id],sw=s&&(s.videoWidth||s.naturalWidth),sh=s&&(s.videoHeight||s.naturalHeight);
      if(sw&&(i.type==='image'||s.readyState>=2)){const k=Math[i.fit==='cover'?'max':'min'](W/sw,H/sh)*i.scale;ctx.filter=((FILT[i.filt]||'')+` brightness(${i.br}%)`).trim();ctx.drawImage(s,-sw*k/2,-sh*k/2,sw*k,sh*k)}}
    ctx.restore();
  }
}
// ── linha do tempo ──
function rTL(){
  const W=Math.max(innerWidth,(total()+4)*pps),st=pps>=100?1:pps>=45?2:5;let h=`<div id="ruler" style="width:${W}px">`;
  for(let s=0;s*pps<W;s+=st)h+=`<i style="left:${s*pps}px">${s}s</i>`;h+='</div>';
  for(let l=0;l<4;l++)h+=`<div class="lane" style="top:${24+l*40}px;width:${W}px"></div>`;
  for(const i of items){const n=i.type==='text'?i.text:media[i.mid]?.name||'';
    h+=`<div class="it${i.id===sid?' on':''}" data-id="${i.id}" style="left:${i.start*pps}px;width:${Math.max(16,i.dur*pps)}px;top:${27+lane(i)*40}px;background:${LC[lane(i)]}">${IC[i.type]} ${esc(n)}</div>`}
  tc.style.width=W+'px';tc.innerHTML=h+'<div id="ph"></div>';ph=$('#ph');ui();
}
function ui(f){
  $('#tm').textContent=fmt(t)+' / '+fmt(total());if(ph)ph.style.left=t*pps+'px';
  if(f){const s=$('#tl'),x=t*pps;if(x>s.scrollLeft+s.clientWidth-30||x<s.scrollLeft)s.scrollLeft=x-60}
}
tc.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.it');
  if(el){const i=get(el.dataset.id),x0=e.clientX,s0=i.start;let mv=0;sid=i.id;el.setPointerCapture(e.pointerId);
    document.querySelectorAll('.it.on').forEach(n=>n.classList.remove('on'));el.classList.add('on');
    el.onpointermove=ev=>{const d=ev.clientX-x0;if(Math.abs(d)>4)mv=1;if(mv){i.start=Math.max(0,Math.round((s0+d/pps)*10)/10);el.style.left=i.start*pps+'px'}};
    el.onpointerup=()=>{el.onpointermove=el.onpointerup=null;if(mv)commit();rTL();rInsp();dirty=1};
  }else if(e.target.closest('#ruler')){const sc=ev=>seek((ev.clientX-tc.getBoundingClientRect().left)/pps);sc(e);tc.setPointerCapture(e.pointerId);tc.onpointermove=sc;tc.onpointerup=()=>{tc.onpointermove=tc.onpointerup=null}}
});
// ── inspetor ──
function rInsp(){
  const i=get(sid);if(!i){ins.innerHTML='<p class="hint">Toque em um clipe da linha do tempo para editar. Arraste o clipe para mover e a régua para navegar. Use os botões acima para adicionar vídeo, imagem, música, texto ou narração.</p>';return}
  const m=media[i.mid],isT=i.type==='text',isA=i.type==='audio',isV=i.type==='video',av=isV||isA,vis=!isA&&!isT;
  const R=(k,l,a,b,s)=>`<label class="r"><span>${l}<b data-o="${k}">${OF[k]?OF[k](i[k]):i[k]}</b></span><input type="range" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${i[k]}"></label>`;
  const S=(k,l,o)=>`<label class="r"><span>${l}</span><select data-k="${k}">${o.map(([v,n])=>`<option value="${v}"${i[k]==v?' selected':''}>${n}</option>`).join('')}</select></label>`;
  const C=(k,l)=>`<label class="c"><input type="checkbox" data-k="${k}"${i[k]?' checked':''}>${l}</label>`;
  let h='';
  if(isT)h+=`<label class="r"><span>Texto</span><textarea data-k="text">${esc(i.text)}</textarea></label><label class="r"><span>Cor</span><input type="color" data-k="color" value="${i.color}"></label>`+R('size','Tamanho',2,25,.5)+S('font','Fonte',[['system-ui','Padrão'],['Impact','Impacto'],['Georgia','Serifada'],['monospace','Mono']])+C('bold','Negrito')+C('box','Fundo atrás do texto');
  h+=R('start','Início',0,Math.max(30,total()+20),.1)+R('dur','Duração',.2,av?Math.max(.3,(m.dur-i.in)/i.speed):60,.1);
  if(av)h+=R('in','Cortar início do arquivo',0,Math.max(0,m.dur-.3),.1)+R('vol','Volume',0,2,.05);
  if(isV)h+=R('speed','Velocidade',.25,4,.05);
  if(vis)h+=S('layer','Camada',[[0,'Principal'],[1,'Sobreposição (por cima)']])+S('filt','Filtro',FN)+R('br','Brilho',40,180,5)+R('scale','Tamanho',.1,3,.05)+R('rot','Rotação',-180,180,1)+S('fit','Ajuste',[['contain','Caber na tela'],['cover','Preencher tela']]);
  if(vis||isT)h+=R('x','Posição horizontal',0,1,.01)+R('y','Posição vertical',0,1,.01)+S('anim','Animação de entrada',AN);
  h+=R('fi','Fade in',0,3,.1)+R('fo','Fade out',0,3,.1);
  ins.innerHTML=h;
}
ins.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.k,i=get(sid);if(!i||!k)return;
  let v=el.type==='checkbox'?+el.checked:el.type==='range'?parseFloat(el.value):el.value;if(k==='layer')v=+v;i[k]=v;
  if(k==='layer'&&v===1&&i.scale===1){i.scale=.45;i.x=.75;i.y=.28;rInsp()}
  const o=ins.querySelector(`[data-o="${k}"]`);if(o)o.textContent=OF[k]?OF[k](v):v;
  if(['start','dur','layer','text'].includes(k))rTL();sync();dirty=1;ui();
});
ins.addEventListener('change',()=>{commit();rTL()});
// ── histórico e ações ──
function commit(){const j=JSON.stringify(items);if(j===saved)return;hist.push(saved);if(hist.length>60)hist.shift();saved=j;fut=[]}
function restore(){items=JSON.parse(saved);if(!get(sid))sid=null;items.forEach(ensureEl);rAll()}
function undo(){if(!hist.length)return;fut.push(saved);saved=hist.pop();restore()}
function redo(){if(!fut.length)return;hist.push(saved);saved=fut.pop();restore()}
function rAll(){$('#empty').style.display=items.length?'none':'flex';rTL();rInsp();seek(t)}
function split(){const i=get(sid);if(!i||t<=i.start+.1||t>=i.start+i.dur-.1)return msg('Selecione um clipe e posicione o cursor dentro dele');
  const b=mk({...i,id:uid(),start:t,dur:i.start+i.dur-t,in:i.in+(t-i.start)*i.speed,fi:0});i.dur=t-i.start;i.fo=0;items.push(b);ensureEl(b);sid=b.id;commit();rAll()}
function dup(){const i=get(sid);if(!i)return;const b=mk({...i,id:uid(),start:i.start+i.dur});items.push(b);ensureEl(b);sid=b.id;commit();rAll()}
function del(){if(!sid)return;items=items.filter(i=>i.id!==sid);sid=null;commit();rAll()}
function addText(){const it=mk({type:'text',start:t,dur:3,y:.8,anim:'zoom'});items.push(it);sid=it.id;commit();rAll()}
async function mic(){
  if(rec){rec.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],at=t,t1=Date.now();rec=new MediaRecorder(st);
    rec.ondataavailable=e=>ch.push(e.data);
    rec.onstop=async()=>{st.getTracks().forEach(x=>x.stop());rec=null;$('#mic').classList.remove('rec');$('#mic').textContent='🎙 Narrar';stop();
      await addFiles([new File(ch,'Narração.webm',{type:'audio/webm'})],{start:at,dur:(Date.now()-t1)/1000})};
    rec.start();$('#mic').classList.add('rec');$('#mic').textContent='⏹ Parar';play();
  }catch{msg('Permita o microfone para gravar narração')}
}
// ── exportar ──
async function exp(){
  if(exporting)return;if(!items.length)return msg('Adicione algo antes de exportar');
  if(!window.MediaRecorder||!cv.captureStream)return msg('Seu navegador não suporta exportação. Use o Chrome.');
  stop();initAudio();await AC.resume();items.forEach(i=>{ensureEl(i);wire(i)});
  const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(c=>MediaRecorder.isTypeSupported(c))||'';
  const ss=new MediaStream([...cv.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]);chunks=[];
  recd=new MediaRecorder(ss,{mimeType:mt,videoBitsPerSecond:6e6});recd.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  recd.onstop=()=>{const type=recd.mimeType||mt||'video/webm',ext=type.includes('mp4')?'mp4':'webm',a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(chunks,{type}));a.download='video-editado.'+ext;a.click();exporting=false;$('#exp').textContent='Exportar';msg('Pronto! Salvo como .'+ext);try{wl&&wl.release()}catch{}};
  exporting=true;try{wl=await navigator.wakeLock?.request('screen')}catch{}
  t=0;seek(0);await sleep(400);recd.start(500);play();msg('Exportando em tempo real — mantenha a tela ligada e esta aba aberta');
}
// ── eventos ──
$('#fv').onchange=e=>{const f=[...e.target.files];e.target.value='';addFiles(f)};
$('#fa').onchange=e=>{const f=[...e.target.files];e.target.value='';addFiles(f)};
$('#pp').onclick=()=>playing?stop():play();$('#hm').onclick=()=>{stop();seek(0);$('#tl').scrollLeft=0};
$('#sp').onclick=split;$('#du').onclick=dup;$('#dl').onclick=del;$('#tx').onclick=addText;$('#mic').onclick=mic;$('#exp').onclick=exp;
$('#un').onclick=undo;$('#re').onclick=redo;$('#ar').onchange=e=>setAR(e.target.value);
$('#zo').onclick=()=>{pps=Math.max(20,pps/1.4);rTL()};$('#zi').onclick=()=>{pps=Math.min(200,pps*1.4);rTL()};
setAR('720x1280');rAll();
</script></body></html>
