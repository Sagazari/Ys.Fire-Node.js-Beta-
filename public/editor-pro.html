<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Editor de Vídeo Pro</title>
<style>
:root{--bg:#0D0F13;--b1:#15181E;--b2:#1B1F27;--b3:#262B35;--ln:#272C36;--tx:#E9EBEF;--t2:#8B93A3;--ac:#8FA98F;--gd:#ffd166;--dk:250px}

#app{height:100dvh;display:grid;grid-template-rows:auto minmax(110px,1fr) auto 206px var(--dk);grid-template-areas:"top" "pv" "tr" "tl" "dk";padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

.top{grid-area:top}.bar{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;align-items:center;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.b{height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--ln);background:var(--b2);color:var(--tx);font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:0 0 auto;cursor:pointer}
.b:active{background:var(--b3)}.b.p{background:var(--ac);color:#0b0d10;border-color:transparent;font-weight:600}.b.on{background:var(--gd);color:#161006;border-color:transparent}.b.rec{background:#c9776b}

#cv{touch-action:none;background:#000;box-shadow:0 0 0 1px #2a2f3a}

#tc{position:relative;min-height:100%}

.it.on{outline:2px solid #fff;z-index:3}.it.drag{opacity:.8;transform:scale(1.02)}
.hd{position:absolute;top:0;bottom:0;width:16px;background:#fff;z-index:4;touch-action:none;display:flex;align-items:center;justify-content:center}
.hd::after{content:"";width:2px;height:12px;background:#333;border-radius:2px}.hd.l{left:0;border-radius:7px 0 0 7px}.hd.r{right:0;border-radius:0 7px 7px 0}
.kd{position:absolute;bottom:2px;width:8px;height:8px;background:var(--gd);transform:translateX(-4px) rotate(45deg);border:1px solid #000;pointer-events:none;z-index:2}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#ff5d5d;pointer-events:none;z-index:6}
#dk{grid-area:dk;display:flex;flex-direction:column;background:var(--b1);min-height:0;overflow:hidden}
@media(min-width:900px) and (min-height:560px){#dk{border-left:1px solid var(--ln)}}
#tabs{display:none;gap:4px;padding:2px 8px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none;border-bottom:1px solid var(--ln)}#tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--t2);font:inherit;padding:9px 10px;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}.tab.on{color:var(--tx);border-color:var(--ac);font-weight:600}
#ins{flex:1;overflow-y:auto;padding:4px 14px 18px;min-height:0;-webkit-overflow-scrolling:touch}
.hint{color:var(--t2);padding:12px 0;line-height:1.5}.hint a{color:var(--gd);margin-right:8px;cursor:pointer;text-decoration:underline}.sub{color:var(--t2);font-size:12px;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.r{display:block;margin:9px 0}.r>span{display:flex;justify-content:space-between;color:var(--t2);font-size:13px;margin-bottom:3px}.r b{color:var(--tx);font-weight:500}.r em{color:var(--gd);font-style:normal;margin-left:4px}
input[type=range]{width:100%;height:30px;accent-color:var(--ac)}
select,textarea{width:100%;background:var(--b2);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:9px;font:inherit;font-size:16px}
#ar{width:auto;padding:8px;font-size:14px}textarea{min-height:64px}input[type=color]{width:100%;height:40px;border:0;background:none}

@media(min-width:700px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px}}
.sheet h3{margin-bottom:8px;font-size:16px}.row{display:flex;gap:8px;margin-top:14px}.row .b{flex:1}
#bk{position:fixed;inset:0;background:#0008;z-index:25;display:none}#bk.show{display:block}
.pkc{margin:12px 0 6px;color:var(--t2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}

.bar2{height:8px;background:var(--b3);border-radius:4px;overflow:hidden;margin:12px 0}.bar2 div{height:100%;width:0;background:var(--ac);transition:width .2s}
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);background:#000e;border:1px solid var(--ln);padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;z-index:99}
</style></head><body>

<div id="tabs"></div><div id="ins"></div></div>
</div>
<div id="bk"></div>

<div class="sheet" id="xp"><h3>Exportar vídeo</h3>
<div id="xo">
<label class="r"><span>Resolução</span><select id="xres"><option value="720">HD · 720p</option><option value="1080" selected>Full HD · 1080p</option><option value="1440">2K · 1440p</option><option value="2160">4K · 2160p (pesado)</option></select></label>

<p class="hint" id="xinfo"></p>
<div class="row"><button class="b" id="xc">Fechar</button><button class="b p" id="xgo">Iniciar exportação</button></div></div>
<div id="xprog" hidden><p class="hint">Exportando em tempo real. Mantenha a tela ligada e esta aba aberta.</p><div class="bar2"><div id="xpb"></div></div><div class="row"><button class="b" id="xcan">Cancelar</button></div></div>
<div id="xdone" hidden><p class="hint" id="xdt">Pronto!</p><div class="row"><button class="b p" id="xsave">Salvar</button><button class="b" id="xshare">Compartilhar</button></div><div class="row"><button class="b" id="xback">Voltar ao editor</button></div></div>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),sleep=ms=>new Promise(r=>setTimeout(r,ms)),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const CF='filter' in CanvasRenderingContext2D.prototype;
let items=[],media={},els={},imgs={},gains={},sid=null,t=0,playing=false,pps=60,AC,dest,saved='[]',hist=[],fut=[],exporting=false,cancelX=false,t0=0,tS=0,raf=0,dirty=1,rec=null,recd,chunks,wl,ph,AR=[9,16],tabNow='',G=null,D=null,ex=null,LT=[],taps=[],warnedCF=false;
const cv=$('#cv'),ctx=cv.getContext('2d'),tc=$('#tc'),tl=$('#tl'),ins=$('#ins'),mctx=document.createElement('canvas').getContext('2d');

const FILT={none:'',pb:'grayscale(1)',sepia:'sepia(.9)',vivid:'saturate(1.8) contrast(1.1)',cold:'hue-rotate(-25deg) saturate(1.2)',warm:'sepia(.35) saturate(1.5)',vint:'sepia(.5) contrast(.9) brightness(1.1)',cont:'contrast(1.5)',blur:'blur(4px)',neg:'invert(1)'};

const LC={video:'#3a6fe8',image:'#7a5cf0',text:'#b8892f',audio:'#3a9a6a',fx:'#c45a8a'},IC={video:'🎞',image:'🖼',text:'T',audio:'🎵',fx:'✨'},LH=34;
const FXK={
shake:{n:'Shake',ic:'📳',d:1.5,p:[['amt','Intensidade',0,100,1,50],['spd','Velocidade',1,40,1,14],['sm','Suavidade',0,100,1,30],['mode','Direção','sel',[['all','Tudo'],['xy','Posição'],['h','Horizontal'],['v','Vertical'],['rot','Rotação'],['zoom','Zoom']],'all'],['fill','Preencher bordas','chk',1]]},
kick:{n:'Kick',ic:'🥁',d:4,p:[['bpm','BPM',60,200,1,128],['off','Atraso',0,2,.01,0],['amt','Zoom',0,100,1,40],['fl','Flash',0,100,1,0],['shk','Shake',0,100,1,0],['div','Batidas','sel',[['.5','1/2x'],['1','1x'],['2','2x'],['4','4x']],'1'],['curve','Curva','sel',[['3','Seca'],['1.5','Média'],['1','Linear']],'3']]},
zoom:{n:'Zoom',ic:'🔍',d:1.2,p:[['amt','Intensidade',0,100,1,60],['mode','Tipo','sel',[['in','Aproximar'],['out','Afastar'],['punch','Punch']],'in']]},
flash:{n:'Flash',ic:'⚡',d:.5,p:[['amt','Intensidade',0,100,1,90],['spd','Strobe Hz (0 = único)',0,30,1,0],['color','Cor','col','#ffffff']]},
glitch:{n:'Glitch',ic:'👾',d:1.2,p:[['amt','Intensidade',0,100,1,60],['spd','Velocidade',1,30,1,12]]},
rgb:{n:'RGB Split',ic:'🌈',d:1.5,p:[['amt','Intensidade',0,100,1,50],['ang','Ângulo',0,360,1,0]]},
vhs:{n:'VHS',ic:'📼',d:2,p:[['amt','Intensidade',0,100,1,60]]},
grain:{n:'Grão',ic:'🎞',d:2,p:[['amt','Intensidade',0,100,1,50]]},
vig:{n:'Vinheta',ic:'⚫',d:2,p:[['amt','Intensidade',0,100,1,60]]},
blur:{n:'Desfoque',ic:'🌫',d:1.5,p:[['amt','Intensidade',0,100,1,50]]},

bars:{n:'Barras',ic:'🎬',d:3,p:[['amt','Tamanho',0,100,1,70]]},
filt:{n:'Filtro',ic:'🎨',d:3,p:[['fk','Filtro','sel',FN.slice(1),'pb'],['amt','Intensidade',0,100,1,100]]}};

const PRE=[
['Shake',[['Leve','shake',{amt:22,spd:12,sm:55}],['Médio','shake',{amt:45,spd:16,sm:35}],['Forte','shake',{amt:80,spd:22,sm:20}],['Terremoto','shake',{amt:100,spd:9,sm:10}],['Câmera na mão','shake',{amt:28,spd:3,sm:100}],['Horizontal','shake',{amt:60,spd:18,sm:30,mode:'h'}],['Vertical','shake',{amt:60,spd:18,sm:30,mode:'v'}],['Giro','shake',{amt:55,spd:14,sm:40,mode:'rot'}]]],
['Kick',[['Kick Zoom','kick',{}],['Kick Flash','kick',{amt:20,fl:55}],['Kick Shake','kick',{amt:25,shk:60}],['Kick 2x','kick',{div:'2',amt:30}],['Pulso lento','kick',{bpm:70,amt:35,curve:'1.5'}]]],
['Movimento',[['Zoom In','zoom',{mode:'in'}],['Zoom Out','zoom',{mode:'out'}],['Punch','zoom',{mode:'punch',amt:70}]]],
['Glitch',[['Glitch','glitch',{}],['RGB Split','rgb',{}],['VHS','vhs',{}],['Pixelar','pixel',{}]]],
['Luz',[['Flash branco','flash',{}],['Flash preto','flash',{color:'#000000'}],['Strobe','flash',{spd:12,amt:60}],['Vinheta','vig',{}],['Grão','grain',{}]]],
['Cinema',[['Barras','bars',{}],['Desfoque','blur',{}],['P&B','filt',{fk:'pb'}],['Sépia','filt',{fk:'sepia'}],['Vívido','filt',{fk:'vivid'}],['Frio','filt',{fk:'cold'}],['Quente','filt',{fk:'warm'}],['Negativo','filt',{fk:'neg'}]]]];

const mk=o=>({id:uid(),type:'video',mid:null,start:0,dur:4,in:0,vol:1,speed:1,filt:'none',br:100,ct:100,sat:100,bl:0,fi:0,fo:0,ain:'none',aout:'none',ad:.6,ao:.6,layer:0,x:.5,y:.5,scale:1,rot:0,op:1,flip:0,fit:'contain',text:'Seu texto',color:'#ffffff',size:7,bold:1,ital:0,outline:1,outc:'#000000',box:0,shadow:0,font:'system-ui',kf:{},...o});
const total=()=>Math.max(.5,...items.map(i=>i.start+i.dur)),get=id=>items.find(i=>i.id===id);

// ── histórico e ações ──
function commit(){const j=JSON.stringify(items);if(j===saved)return;hist.push(saved);if(hist.length>80)hist.shift();saved=j;fut=[]}
function restore(){items=JSON.parse(saved);if(!get(sid))sid=null;items.forEach(ensureEl);rAll()}
function undo(){if(!hist.length)return;fut.push(saved);saved=hist.pop();restore()}
function redo(){if(!fut.length)return;hist.push(saved);saved=fut.pop();restore()}
function rAll(){$('#empty').style.display=items.length?'none':'flex';rTL();rInsp();seek(t)}
function split(){const i=get(sid);if(!i||t<=i.start+.1||t>=i.start+i.dur-.1)return msg('Selecione um clipe e posicione o cursor dentro dele');
  const lt=t-i.start,[ka,kb]=splitKF(i.kf,lt),b=mk({...i,id:uid(),start:t,dur:i.start+i.dur-t,in:i.in+lt*i.speed,fi:0,kf:kb});i.dur=lt;i.fo=0;i.kf=ka;items.push(b);ensureEl(b);sid=b.id;commit();rAll()}
function dup(){const i=get(sid);if(!i)return;const b=mk({...i,id:uid(),start:i.start+i.dur,kf:JSON.parse(JSON.stringify(i.kf))});items.push(b);ensureEl(b);sid=b.id;commit();rAll()}
function del(){if(!sid)return;items=items.filter(i=>i.id!==sid);sid=null;commit();rAll()}
function addText(){const it=mk({type:'text',start:t,dur:3,y:.8,ain:'zoom'});items.push(it);sid=it.id;tabNow='Texto';commit();rAll()}
function addFx(kind,pr){const it=mk({type:'fx',kind,start:t,dur:FXK[kind].d,...FXDEF(kind),...pr});items.push(it);sid=it.id;tabNow='Efeito';commit();closeSheets();rAll()}
function openPk(){$('#pkc').innerHTML=PRE.map(([c,a])=>`<div class="pkc">${c}</div><div class="pg">${a.map(([n,k,p])=>`<button class="pi" data-k="${k}" data-p='${JSON.stringify(p)}'><i>${FXK[k].ic}</i>${n}</button>`).join('')}</div>`).join('');$('#pk').classList.add('show');$('#bk').classList.add('show')}
function closeSheets(){$('#pk').classList.remove('show');if(!exporting&&!ex)$('#xp').classList.remove('show');$('#bk').classList.remove('show')}
$('#pkc').addEventListener('click',e=>{const b=e.target.closest('.pi');if(b)addFx(b.dataset.k,JSON.parse(b.dataset.p))});
async function mic(){
  if(rec){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],at=t,t1=Date.now();rec=new MediaRecorder(st);const mt=rec.mimeType||'audio/webm';
    rec.ondataavailable=e=>ch.push(e.data);
    rec.onstop=async()=>{st.getTracks().forEach(x=>x.stop());rec=null;$('#mic').classList.remove('rec');$('#mic').textContent='🎙 Narrar';stop();await addFiles([new File(ch,'Narração.'+(mt.includes('mp4')?'m4a':'webm'),{type:mt})],{start:at,dur:(Date.now()-t1)/1000})};
    rec.start();$('#mic').classList.add('rec');$('#mic').textContent='⏹ Parar';play();
  }catch{msg('Permita o microfone para gravar narração')}}
// ── exportar ──
const dims=s=>{const r=AR[0]/AR[1];let W,H;if(r<=1){W=s;H=Math.round(s/r)}else{H=s;W=Math.round(s*r)}return[W&~1,H&~1]};
function xinfo(){const s=+$('#xres').value,f=+$('#xfps').value,q=+$('#xq').value,[W,H]=dims(s),br=clamp(W*H*f*q,2e6,80e6);$('#xinfo').textContent=`${W}×${H} · ${f} fps · ~${(br/1e6).toFixed(0)} Mbps · ~${Math.max(1,Math.round(br*total()/8/1e6))} MB. ${s>=2160?'4K pode falhar em celulares. Se travar, use 2K.':'A exportação roda em tempo real.'}`}
['#xres','#xfps','#xq'].forEach(s=>$(s).onchange=xinfo);
function openXp(){if(!items.length)return msg('Adicione algo antes de exportar');stop();$('#xo').hidden=false;$('#xprog').hidden=true;$('#xdone').hidden=true;xinfo();$('#xp').classList.add('show');$('#bk').classList.add('show')}
async function startExport(){
  if(exporting)return;if(!window.MediaRecorder||!ecv.captureStream)return msg('Seu navegador não suporta exportação. Use o Chrome ou o Safari atualizado.');
  const s=+$('#xres').value,fps=+$('#xfps').value,q=+$('#xq').value,[W,H]=dims(s),br=clamp(W*H*fps*q,2e6,80e6);
  ecv.width=W;ecv.height=H;ex={c:ecv.getContext('2d'),W,H,s,fps};cancelX=false;
  $('#xo').hidden=true;$('#xprog').hidden=false;$('#xpb').style.width='0%';$('#bk').classList.remove('show');$('#app').classList.add('lock');
  stop();initAudio();await AC.resume();items.forEach(i=>{ensureEl(i);wire(i)});
  const mt=['video/mp4;codecs=avc1.64002A,mp4a.40.2','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(c=>MediaRecorder.isTypeSupported(c))||'';
  try{const ss=new MediaStream([...ecv.captureStream(fps).getVideoTracks(),...dest.stream.getAudioTracks()]);chunks=[];
    recd=new MediaRecorder(ss,{mimeType:mt,videoBitsPerSecond:br,audioBitsPerSecond:192000});
    recd.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    recd.onstop=()=>{exporting=false;$('#app').classList.remove('lock');try{wl&&wl.release()}catch{}
      if(cancelX){ex=null;$('#xp').classList.remove('show');msg('Exportação cancelada');dirty=1;return}
      const type=recd.mimeType||mt||'video/webm',ext=type.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type});ex.blob=blob;ex.name=`video-editado-${s}p.${ext}`;
      $('#xprog').hidden=true;$('#xdone').hidden=false;$('#xdt').textContent=`Pronto! ${W}×${H} · ${(blob.size/1e6).toFixed(1)} MB (.${ext})`;$('#xshare').hidden=!(navigator.canShare&&navigator.canShare({files:[new File([blob],ex.name,{type})]}));dirty=1};
    exporting=true;try{wl=await navigator.wakeLock?.request('screen')}catch{}
    t=0;seek(0);await sleep(500);recd.start(500);play();
  }catch(err){exporting=false;ex=null;$('#app').classList.remove('lock');$('#xo').hidden=false;$('#xprog').hidden=true;msg('Falha ao iniciar. Tente uma resolução menor.')}}
$('#xgo').onclick=startExport;$('#xc').onclick=()=>{$('#xp').classList.remove('show');$('#bk').classList.remove('show')};
$('#xcan').onclick=()=>{cancelX=true;stop();if(recd&&recd.state!=='inactive')recd.stop()};
$('#xback').onclick=()=>{ex=null;$('#xp').classList.remove('show');$('#bk').classList.remove('show')};
$('#xsave').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(ex.blob);a.download=ex.name;a.click()};
$('#xshare').onclick=async()=>{try{await navigator.share({files:[new File([ex.blob],ex.name,{type:ex.blob.type})]})}catch{}};
// ── eventos ──
$('#fv').onchange=e=>{const f=[...e.target.files];e.target.value='';addFiles(f)};
$('#fa').onchange=e=>{const f=[...e.target.files];e.target.value='';addFiles(f)};
$('#pp').onclick=()=>playing?stop():play();$('#hm').onclick=()=>{stop();seek(0);tl.scrollLeft=0};
$('#sp').onclick=split;$('#du').onclick=dup;$('#dl').onclick=del;$('#kf').onclick=toggleKF;$('#tx').onclick=addText;$('#fxb').onclick=openPk;$('#mic').onclick=mic;$('#exp').onclick=openXp;
$('#pkx').onclick=closeSheets;$('#bk').onclick=closeSheets;
$('#mn').onclick=()=>{const a=$('#app');a.classList.toggle('mn');$('#mn').textContent=a.classList.contains('mn')?'▴':'▾'};
$('#un').onclick=undo;$('#re').onclick=redo;$('#ar').onchange=e=>setAR(e.target.value);
$('#zo').onclick=()=>{pps=Math.max(20,pps/1.4);rTL()};$('#zi').onclick=()=>{pps=Math.min(240,pps*1.4);rTL()};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();playing?stop():play()}else if(e.key==='Delete'||e.key==='Backspace')del();else if(e.key==='s'||e.key==='S')split();else if(e.key==='k'||e.key==='K')toggleKF();
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
new ResizeObserver(layout).observe($('#pv'));addEventListener('resize',()=>{layout();rTL()});
setAR('9:16');rAll();loop();
</script></body></html>
